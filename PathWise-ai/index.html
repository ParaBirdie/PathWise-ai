<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathWise AI</title>


    <!--
      Security headers (CSP, X-Frame-Options, Referrer-Policy, Permissions-Policy)
      are delivered as HTTP response headers, not meta tags:
        - production:   vercel.json / netlify.toml
        - vite dev:     vite.config.js  server.headers
        - vite preview: vite.config.js  preview.headers
      A <meta> CSP used to live here too. It was removed because the browser
      enforces the intersection of every policy it receives, so the duplicate
      silently overrode the header (pinning img-src to 'self' data:), and its
      script-src blocked the React Refresh inline preamble, leaving `npm run dev`
      a blank page. frame-ancestors and X-Frame-Options are ignored in meta form
      regardless. Keep the policy in the header configs only.
    -->
    <!-- Prevent MIME-type sniffing attacks -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Limit referrer information sent to third parties -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Inter font is self-hosted via @fontsource/inter (imported in src/main.jsx).
         No external font CDN requests; eliminates the Google Fonts SRI / privacy risk. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
